services:
  app-logic:
    build:
      context: ./backend
    container_name: app-logic
    expose:
      - "3001"
    env_file:
      - .env
    restart: always

  web-server:
    image: nginx:alpine
    container_name: web-server
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app-logic
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    restart: always